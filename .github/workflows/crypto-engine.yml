name: crypto-engine

on:
  push:
    paths: ["crypto-engine/**", ".github/workflows/crypto-engine.yml"]
  pull_request:
    paths: ["crypto-engine/**", ".github/workflows/crypto-engine.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: crypto-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Hot-path benchmark (informational)
        run: python benchmarks/bench_hotpath.py --frames 50000
