[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketintel"
version = "1.0.0"
description = "Multi-exchange crypto market intelligence engine (Binance + Coinbase market data, PAPER TRADING ONLY)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "websockets>=14.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sortedcontainers>=2.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "playwright>=1.45",
    "ruff>=0.5",
]

[project.scripts]
marketintel = "marketintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "live: requires network access to Binance (deselected unless MIE_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311", "S104", "S110", "B008", "B027", "B905", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"benchmarks/**" = ["S"]
